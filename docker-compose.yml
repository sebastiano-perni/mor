services:
  postgres:
    image: postgres:17-alpine
    container_name: mor_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mor_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data_v17:/var/lib/postgresql/data
      - ./dump.dump:/dump.dump:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-mor_db}"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mor_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/mor_db}
      PORT: ${PORT:-5000}
      VITE_PORT: ${VITE_PORT:-3000}
      BASE_PATH: ${BASE_PATH:-/}
      API_TARGET: ${API_TARGET:-http://localhost:5000}
    ports:
      - "${VITE_PORT:-3000}:${VITE_PORT:-3000}"
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ./dump.dump:/app/dump.dump:ro

volumes:
  postgres_data_v17:
