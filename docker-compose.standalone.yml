version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: mor_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mor_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mor_db"]
      interval: 2s
      timeout: 3s
      retries: 10

  app:
    build:
      context: https://github.com/sebastiano-perni/mor.git#main
    container_name: mor_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/mor_db
      PORT: "5000"
      VITE_PORT: "3000"
      BASE_PATH: "/"
      API_TARGET: "http://localhost:5000"
    ports:
      - "3000:3000"
      - "5000:5000"

volumes:
  postgres_data:
